name: Copy Google Spreadsheet Mokuhyoukanri Report

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '手動実行の理由'
        required: false
        default: '手動実行'

  schedule:
    - cron: '0 0 3 * *'

jobs:
  copy_spreadsheet_mokuhyoukanri_report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: google_auto/gas

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          mkdir -p ~/.config
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Create .clasp.json
        run: |
          echo '{ "scriptId": "${{ secrets.GAS_SCRIPT_ID }}", "rootDir": "." }' > .clasp.json

      - name: Run copyMokuhyoukanriReport on Google Apps Script
        run: clasp run copyMokuhyoukanriReport
